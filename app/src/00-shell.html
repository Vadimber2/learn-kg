<!DOCTYPE html>
<html lang="ru" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e7490'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3E%D3%A8%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Кыргыз тили — тренажёр</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --panel:#ffffff; --ink:#1c2430; --muted:#66707d;
    --accent:#0e7490; --accent-soft:#e0f2f7; --ok:#15803d; --ok-soft:#dcfce7;
    --err:#b91c1c; --err-soft:#fee2e2; --warn:#92400e; --warn-soft:#fef3c7;
    --line:#dde2e8; --line2:#e8ecf1; --th:#f0f3f6; --kg:#7c3aed; --kg-soft:#ede9fe;
  }
  html[data-theme="dark"]{
    --bg:#10151c; --card:#1a212b; --panel:#161c25; --ink:#e7ecf2; --muted:#8b98a7;
    --accent:#38bdf8; --accent-soft:#123542; --ok:#4ade80; --ok-soft:#122b1c;
    --err:#f87171; --err-soft:#3b1a1a; --warn:#fbbf24; --warn-soft:#332708;
    --line:#2a3442; --line2:#232d3a; --th:#1f2835; --kg:#a78bfa; --kg-soft:#241d3a;
  }
  @media (prefers-color-scheme: dark){
    html[data-theme="auto"]{
      --bg:#10151c; --card:#1a212b; --panel:#161c25; --ink:#e7ecf2; --muted:#8b98a7;
      --accent:#38bdf8; --accent-soft:#123542; --ok:#4ade80; --ok-soft:#122b1c;
      --err:#f87171; --err-soft:#3b1a1a; --warn:#fbbf24; --warn-soft:#332708;
      --line:#2a3442; --line2:#232d3a; --th:#1f2835; --kg:#a78bfa; --kg-soft:#241d3a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  .layout{display:flex;min-height:100vh}
  aside{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{font-weight:700;font-size:1.02rem;padding:0 8px;display:block;color:inherit;text-decoration:none}
  .brand span{display:block;font-weight:400;font-size:.78rem;color:var(--muted)}
  nav{display:flex;flex-direction:column;gap:4px}
  nav button{border:1px solid transparent;background:transparent;border-radius:9px;padding:9px 12px;font-size:.92rem;cursor:pointer;color:var(--ink);text-align:left;width:100%}
  nav button:hover{background:var(--line2)}
  nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px;font-size:.8rem;color:var(--muted)}
  .side-bottom .who{color:var(--ink);font-weight:600}
  .topbar{display:none;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20}
  .topbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:1rem;cursor:pointer}
  .content{flex:1;min-width:0}
  .banner{background:var(--warn-soft);color:var(--warn);padding:7px 16px;font-size:.8rem}
  main{max-width:880px;margin:0 auto;padding:20px 16px 60px}
  /* две плавающие кнопки внизу справа: на узком экране контент не должен уходить под них */
  @media (max-width:899px){main{padding-bottom:150px}}
  @media (max-width:820px){
    aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 24px rgba(0,0,0,.25)}
    .layout.side-open aside{transform:none}
    /* Бэкдроп: затемняет контент под открытым меню (aside z-40 выше, topbar z-20 ниже),
       тап по нему ловит документный обработчик и закрывает меню */
    .layout.side-open::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
    .topbar{display:flex}
  }
  /* Спиннер холодного старта: страница-монолит парсится секунды, без него рефреш
     выглядит зависшим (переход с лендинга прикрыт лендинговым .wait-spin). Разметка —
     сразу после открытия body, до тяжёлого скрипта: браузер отрисует её первой;
     убирает boot по завершении первого рендера. Слово «скрипт» здесь не тегом:
     валидатор вариантов ищет открывающий тег регекспом по всему HTML. */
  #boot-wait{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  #boot-wait span{display:block;width:44px;height:44px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--accent);animation:bootSpin .9s linear infinite}
  @keyframes bootSpin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#boot-wait span{animation-duration:2.4s}}
  .dlg-line{padding:7px 0;border-bottom:1px solid var(--line2);line-height:1.55}
  .dlg-line:last-child{border-bottom:0}
  .dlg-line.now{background:var(--accent-soft);border-radius:8px;padding-left:6px}
  .dlg-sp{color:var(--muted);font-weight:650}
  .dlg-hide-tr .dlg-tr{display:none}
  .dlg-hide-tr .dlg-line.open .dlg-tr{display:inline}
  .dlg-line{cursor:pointer}
  .ambon{border-color:var(--accent);color:var(--accent)}
  .dlg-verse{margin:12px 0;padding:10px 12px;border:1px solid var(--line2);border-radius:10px}
  .dlg-verse .kgword{border-radius:6px;padding:0 6px;margin:0 -6px;transition:background .2s,box-shadow .2s}
  /* kara — текущая строка караоке: фон + маркер-полоска слева, различимо в обеих темах
     (один лишь --kg-soft в тёмной теме почти сливался с фоном карточки) */
  .dlg-verse .kgword.kara{background:var(--kg-soft);box-shadow:inset 3px 0 0 var(--kg)}
  .dlg-q{cursor:pointer}
  .dlg-hide-tr .dlg-q.open .dlg-tr{display:block}
  /* Выдвижная панель справа: разборы попыток и детали показателей */
  .sp-back{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:60;transition:background .2s}
  .sp-back.on{background:rgba(0,0,0,.4)}
  .sp-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--card);border-left:1px solid var(--line);z-index:61;transform:translateX(105%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(0,0,0,.25)}
  .sp-panel.on{transform:none}
  .sp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .sp-body{padding:14px 18px;overflow-y:auto}
  .spark{display:inline-block;vertical-align:middle;color:var(--accent)}
  .stat-click{cursor:pointer}
  .stat-click:hover{box-shadow:inset 0 0 0 1px var(--accent)}
  .trend{display:block;font-size:.72rem;margin-top:3px;color:var(--muted)}
  /* Строка слова в панели: сетка, ничего не пляшет */
  .wp-row{display:grid;grid-template-columns:auto 1fr max-content;gap:2px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);cursor:pointer}
  .wp-row .kgword{white-space:nowrap;font-weight:600}
  .wp-gloss{color:var(--muted);font-size:.8rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .wp-meta{text-align:right;white-space:nowrap}
  .wp-due{display:block;color:var(--muted);font-size:.7rem;margin-top:1px}
  .wp-bar{flex:1;max-width:64px;text-align:center}
  .wp-bar>i{display:block;background:var(--line2);border-radius:4px 4px 0 0;position:relative;height:36px}
  .wp-bar>i>b{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:4px 4px 0 0}
  .trend .up{color:var(--ok)} .trend .down{color:var(--err)}
  .dlg-ctlrow{position:sticky;top:0;z-index:5;background:var(--card);padding:8px 0;margin-bottom:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
  /* Старт экзамена: заголовок, одна строка сути и крупная кнопка — вход виден сразу */
  .exam-hero{text-align:center;padding:10px 0 4px}
  .exam-hero .bigword{margin-bottom:6px}
  .exam-hero p{max-width:46ch;margin:0 auto 14px;color:var(--muted)}
  .exam-hero .btn{margin-bottom:10px}
  .exam-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .exam-bar .muted{margin-left:auto}
  .ov-shot{margin:0 0 14px}
  .ov-shot img{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block}
  .ov-shot figcaption{margin-top:6px;font-size:.9rem}
  .exam-ta{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;margin:8px 0}
  h2{font-size:1.05rem;margin:0 0 10px} h3{font-size:.95rem;margin:16px 0 6px}
  .muted{color:var(--muted);font-size:.87rem}
  table{border-collapse:collapse;width:100%;font-size:.9rem}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
  th{background:var(--th)}
  .kgword{color:var(--kg);font-weight:600}
  .letter{display:inline-block;min-width:34px;text-align:center;padding:6px 4px;margin:2px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:1.05rem}
  .letter.special{background:var(--kg-soft);border-color:var(--kg);color:var(--kg);font-weight:700}
  .pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;background:var(--accent-soft);color:var(--accent);margin-left:6px}
  .progressbar{height:10px;background:var(--line2);border-radius:99px;overflow:hidden;margin:6px 0 2px}
  .progressbar>div{height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
  .bigword{font-size:1.7rem;font-weight:700;margin:8px 0}
  .opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
  .opts button{text-align:left;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;font-size:.95rem}
  .opts button:hover{border-color:var(--accent)}
  .opts button.correct{background:var(--ok-soft);border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok);font-weight:600;display:flex;align-items:center;gap:8px}
  .opts button.wrong{background:var(--err-soft);border-color:var(--err)}
  .opts button:disabled{cursor:default;opacity:.9}
  input[type=text],input[type=search]{width:100%;padding:10px 12px;font-size:1.05rem;border:1px solid var(--line);border-radius:10px;font-family:inherit;background:var(--bg);color:var(--ink)}
  input[type=text]:focus,input[type=search]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  td a{color:var(--accent);font-weight:600;text-decoration:none}
  td a:hover{text-decoration:underline}
  .kbd{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
  .kbd button{font-size:1.15rem;padding:8px 14px;border:1px solid var(--kg);background:var(--kg-soft);color:var(--kg);border-radius:8px;cursor:pointer;font-weight:700}
  .btn{padding:9px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:.92rem;cursor:pointer}
  .btn.secondary{background:var(--card);color:var(--accent)}
  .btn.ghost{background:var(--card);color:var(--muted);border-color:var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  /* Тумблер с двумя подписями: обе в одной grid-ячейке, ширина = максимум — не прыгает */
  .btn.tgl{display:inline-grid;justify-items:start;text-align:left}
  .btn.tgl>span{grid-area:1/1;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .btn.tgl>.tgl-act{visibility:hidden}
  .btn.tgl.on>.tgl-idle{visibility:hidden}
  .btn.tgl.on>.tgl-act{visibility:visible}
  .feedback{padding:10px 14px;border-radius:10px;margin:10px 0;font-size:.95rem}
  .feedback.ok{background:var(--ok-soft);color:var(--ok)}
  .feedback.err{background:var(--err-soft);color:var(--err)}
  .statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:10px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .stat b{font-size:1.45rem;display:block}
  .stat span{font-size:.78rem;color:var(--muted)}
  .stat.big b{font-size:2.1rem}
  .statrow.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  /* плитка-кнопка: те же размеры, что у обычной плитки, но видно, что по ней кликают */
  .statbtn{font-family:inherit;text-align:left;cursor:pointer;color:inherit;transition:border-color .14s ease,transform .14s ease}
  .statbtn:hover{border-color:var(--accent)}
  .statbtn:active{transform:translateY(1px)}
  /* Связь с преподавателем: две кнопки висят над контентом на любом экране —
     круг 56px (тач-таргет) в углу с учётом выреза. Внизу зелёная WhatsApp (фирменный
     цвет узнаётся без подписи), над ней акцентная кнопка чата; обе в один клик.
     Геометрия у них одна и живёт общим селектором — своё только место и цвет. */
  .wa-fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#08210f}
  .chat-fab{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;font-weight:600}
  .wa-fab,.chat-fab{right:16px;z-index:60;border:0;cursor:pointer;font-family:inherit;text-decoration:none}
  .wa-fab,.chat-fab{display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .wa-fab,.chat-fab{border-radius:999px;padding:0;width:56px;height:56px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .wa-fab:hover,.chat-fab:hover{filter:brightness(1.06)}
  .wa-fab:active{transform:translateY(1px)}
  .wa-fab .ic,.chat-fab .ic{stroke-width:2}
  /* подпись у плавающих кнопок скрыта на любой ширине: обе — круглые иконки с aria-label
     (решение владельца 06.09.2026); текст остаётся в DOM для скринридера */
  .wa-fab-t{display:none}
  @media (prefers-reduced-motion:reduce){.wa-fab:active{transform:none}}
  /* Счётчик ответов преподавателя: кружок в углу кнопки (сама кнопка fixed —
     этого достаточно, чтобы быть системой координат для absolute). */
  .fab-badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;
             border-radius:99px;background:var(--accent);color:#fff;font-size:.72rem;font-weight:700;
             line-height:20px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
  /* Переписка: свои сообщения справа, ответы преподавателя слева, время — тихой строкой */
  .chat-list{display:flex;flex-direction:column;gap:8px;margin:8px 0}
  .chat-msg{display:flex;flex-direction:column;gap:2px;max-width:86%;padding:8px 10px;
            border:1px solid var(--line);border-radius:12px;background:var(--card);white-space:pre-wrap;
            overflow-wrap:anywhere}
  .chat-msg.me{align-self:flex-end;border-color:var(--accent);background:var(--accent-soft)}
  .chat-msg.them{align-self:flex-start}
  .chat-meta{font-size:.7rem;color:var(--muted);align-self:flex-end}
  /* «Сообщения» преподавателя — по образцу мобильных мессенджеров: список строк с аватаром,
     временем и счётчиком; тред с компактной шапкой, разделителями дат и композером внизу.
     Всё на переменных темы — светлая и тёмная одинаково. */
  .ib-card{padding:0;overflow:hidden}
  .ib-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .ib-title{margin:0;display:flex;align-items:center;gap:6px;font-size:1.05rem}
  .ib-count{margin:0}
  .ib-top .rev-filters{margin:0}
  .ib-rows{display:flex;flex-direction:column}
  /* .panel-row объявлен ниже и по умолчанию колонкой — строка мессенджера перебивает его удвоенной специфичностью */
  .panel-row.ib-row{flex-direction:row;align-items:center;gap:12px;padding:12px 16px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;cursor:pointer;margin:0}
  .panel-row.ib-row:last-child{border-bottom:0}
  .panel-row.ib-row:hover,.panel-row.ib-row:focus-visible{background:var(--panel)}
  .ib-avatar{flex:none;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--line2);color:var(--muted);font-weight:700}
  .ib-avatar-s{background:var(--accent-soft);color:var(--accent)}
  .ib-row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .ib-row-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .ib-row-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-time{flex:none;font-size:.76rem;color:var(--muted)}
  .ib-row-sub{font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-you{color:var(--ink)}
  .ib-unread .ib-row-sub,.ib-unread .ib-row-top b{color:var(--ink);font-weight:600}
  .ib-badge{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;line-height:22px;text-align:center}
  .ib-empty{padding:16px}
  .ib-thread{padding:0;display:flex;flex-direction:column;min-height:min(70vh,640px)}
  .ib-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card)}
  .ib-back{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .ib-back:hover,.ib-back:focus-visible{background:var(--panel)}
  .ib-head-t{flex:1;min-width:0;display:flex;flex-direction:column}
  .ib-head-t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-head-t small{color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-roster{flex:none;padding:6px 10px;font-size:.82rem}
  .ib-msgs{flex:1;padding:12px 14px;margin:0}
  .chat-day{align-self:center;font-size:.74rem;color:var(--muted);background:var(--line2);padding:2px 10px;border-radius:99px;margin:4px 0}
  .ib-composer{position:sticky;bottom:0;display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card)}
  .ib-composer textarea{flex:1;min-height:42px;max-height:160px;resize:none;line-height:1.35}
  .ib-send{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--accent);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .ib-send[disabled]{opacity:.6}
  .ib-status{margin:0;padding:0 14px 10px;font-size:.82rem;min-height:0}
  /* Поле ответа в панели чата и во «Входящих» — в теме оболочки, а не белое системное */
  .panel textarea,.ib-composer textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);
            border-radius:10px;padding:10px;font:inherit;resize:vertical}
  /* Раздел «Уроки»: плеер одной строкой, ниже — текущий сегмент и темы */
  .lesson-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  :where(.lesson-row,.stt-actions) .btn:not(.primary){background:transparent;color:var(--ink);border-color:var(--line)}
