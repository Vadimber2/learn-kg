name: ci
on: [push, pull_request]
permissions: { contents: read }   # токену CI — только чтение (ИБ-2 п. 11.2)
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4 }   # та же версия, что FROM в Dockerfile
      - run: npm test
      # зависимостей у проекта нет; появятся (и lock-файл) — аудит high/critical валит сборку
      - if: hashFiles('package-lock.json') != ''
        run: npm audit --omit=dev --audit-level=high
